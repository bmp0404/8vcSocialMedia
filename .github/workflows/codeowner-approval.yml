name: codeowner-approval

# Reviews don't trigger this workflow. codeowner-rerun.yml reruns it instead, because a separate run
# started by a review leaves this run's failure blocking the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codeowner-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codeowner-approval:
    runs-on: ubuntu-latest
    steps:
      # Read CODEOWNERS and the script from the base branch, so a pull request can't change its own rules.
      # Use the branch's current tip. base.sha is the base as of the PR's last push and misses CODEOWNERS changes since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github
      # The pull request that adds this check runs before main has the script, so it passes.
      - run: |
          if [ -f .github/scripts/codeowner_check.py ]; then
            python3 .github/scripts/codeowner_check.py
          else
            echo "main has no codeowner_check.py yet, so this check passes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
