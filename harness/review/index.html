<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#c6cdd1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d0f" media="(prefers-color-scheme: dark)">
<title>Clearance</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/b612-mono-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/xpost.css">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <nav class="rail" aria-label="Views">
    <a class="brand" href="#/queue">
      <span class="brand-name">Clearance</span>
      <span class="brand-sub">Media harness checkpoint</span>
    </a>
    <div id="nav" class="nav"></div>
    <div id="rail-foot" class="rail-foot"></div>
  </nav>
  <main id="main" class="main" tabindex="-1">
    <div id="view"></div>
  </main>
  <footer class="readback" aria-label="Last action">
    <div id="fixture-banner" class="fixture-banner" hidden></div>
    <div id="readback-text" class="readback-text" role="status" aria-live="polite">Ready.</div>
    <div id="readback-chips" class="readback-chips"></div>
    <div id="readback-hints" class="readback-hints" aria-hidden="true"></div>
  </footer>
</div>
<div id="toasts" class="toasts"></div>
<dialog id="keys-sheet" class="sheet" aria-labelledby="keys-title">
  <div class="sheet-head">
    <h2 id="keys-title">Keyboard</h2>
    <button id="keys-close" class="btn btn-quiet btn-small" type="button">Close <kbd>esc</kbd></button>
  </div>
  <div id="keys-body" class="sheet-body"></div>
</dialog>
<noscript><p style="padding:24px">Clearance needs JavaScript. The JSON API is at <a href="/api/runs">/api/runs</a>.</p></noscript>
</body>
</html>
