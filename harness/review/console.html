<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Console</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --sunk: #efefeb; --ink: #1b1b1a; --muted: #6b6b66; --faint: #9a9a94; --line: #e3e3de;
    --accent: #e8572a; --accent-soft: #fbe3da; --ok: #1f8a4c; --bad: #c0392b; --warn: #b7791f; --focus: #2b6cb0;
    --edge: #c9c9c2; --shadow: 0 10px 30px rgba(20, 20, 18, .12);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1e1e1c; --sunk: #181817; --ink: #ececea; --muted: #9a9a94; --faint: #6f6f6a; --line: #33332f;
      --accent: #f07a50; --accent-soft: #3a2219; --ok: #4cc283; --bad: #ef6b5e; --warn: #e0a84a; --focus: #6aa7f0;
      --edge: #45453f; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  a { color: var(--focus); }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  select, button, input, textarea { font: inherit; color: inherit; }
  select, input { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }

  /* ---------- chrome ---------- */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px 6px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .brand .mark svg { width: 14px; height: 14px; }
  .brand small { font-weight: 500; color: var(--muted); font-size: 13px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px;
           border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.mock { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s infinite; }
  .live.off i { background: var(--bad); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .newrun { display: none; border: 0; background: var(--accent); color: #fff; font-weight: 600; font-size: 12px; border-radius: 999px; padding: 4px 11px; }
  .newrun.show { display: inline-block; }
  nav { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
  nav a { color: var(--muted); text-decoration: none; padding: 8px 10px 9px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  nav a:hover { color: var(--ink); }
  nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
  nav a .n { font-size: 11px; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 4px; color: var(--muted); }
  nav a .n.hot { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); margin-left: 6px; }
  .section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .empty { color: var(--muted); text-align: center; padding: 36px 12px; }
  .empty code { background: var(--sunk); padding: 2px 6px; border-radius: 4px; }
  .muted { color: var(--muted); }
  .note-strip { font-size: 12.5px; color: var(--muted); background: var(--sunk); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
  .note-strip b { color: var(--ink); }

  /* ---------- KPI tiles ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .kpi .k { font-size: 12px; color: var(--muted); }
  .kpi .d { font-size: 11.5px; color: var(--faint); margin-top: 2px; }

  /* ---------- OODA rail ---------- */
  .rail { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 0; position: relative; }
  .stage { position: relative; padding: 12px 12px 12px 14px; border: 1px solid var(--line); background: var(--card); margin-right: -1px; min-width: 0; }
  .stage:first-child { border-radius: 12px 0 0 12px; }
  .stage:last-child { border-radius: 0 12px 12px 0; }
  .stage .num { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .stage .name { font-weight: 700; font-size: 14px; margin: 1px 0 6px; display: flex; align-items: center; gap: 6px; }
  .stage .big { font-size: 20px; font-weight: 700; }
  .stage .lbl { font-size: 12px; color: var(--muted); }
  .stage .t { font-size: 11.5px; color: var(--faint); margin-top: 4px; font-family: var(--mono); }
  .stage .who { font-size: 11px; color: var(--faint); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.done { background: var(--ok); } .dot.wait { background: var(--warn); } .dot.none { background: var(--line); } .dot.err { background: var(--bad); }
  .loopback { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 12px; color: var(--accent); margin-top: 8px; }
  .loopback svg { width: 70%; height: 14px; }

  /* ---------- funnel ---------- */
  .funnel { display: grid; grid-template-columns: max-content 1fr max-content max-content; gap: 6px 12px; align-items: center; font-size: 13px; }
  .funnel .track { height: 14px; position: relative; }
  .funnel .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .funnel .val { font-weight: 700; text-align: right; }
  .corr { display: grid; grid-template-columns: max-content 1fr max-content; gap: 8px 12px; align-items: center; font-size: 13px; }
  .corr .ctrack { position: relative; height: 14px; }
  .corr .ctrack b { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
  .corr .ctrack i { position: absolute; top: 2px; bottom: 2px; background: var(--accent); border-radius: 4px; min-width: 2px; }
  .corr .val { font-weight: 700; text-align: right; font-family: var(--mono); font-size: 12px; }
  .runctl { display: inline-flex; }
  .runctl select { border-radius: 6px 0 0 6px; border-right: 0; padding: 4px 6px; font-size: 13px; }
  .runctl button { border-radius: 0 6px 6px 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .runctl button.busy { color: var(--accent); }
  .rev { font-size: 10.5px; font-weight: 700; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }
  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .rows { display: grid; grid-template-columns: max-content 1fr max-content; gap: 7px 12px; align-items: center; font-size: 13px; }
  .rows .track { height: 14px; position: relative; cursor: default; }
  .rows .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .rows .val { font-weight: 700; text-align: right; font-family: var(--mono); font-size: 12px; }
  .rows .val small { font-weight: 400; color: var(--faint); margin-left: 6px; }
  .posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 10px; }
  .star { color: var(--accent); }

  /* ---------- Live (home) ---------- */
  .hero { --h-bg: #0e0e0d; --h-ink: #f2f1ec; --h-muted: #8d8c86; --h-faint: #4a4a46; --h-line: #2a2a27; --h-accent: #f07a50; --h-ok: #4cc283; --h-warn: #e0a84a;
          position: relative; background: radial-gradient(ellipse at 50% 45%, #1b1a18 0%, var(--h-bg) 62%); color: var(--h-ink);
          border-radius: 16px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 640px;
          border: 1px solid #222; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stagearea { position: relative; min-height: 640px; }
  .slabel { position: absolute; transform: translate(-50%, -50%); text-align: center; pointer-events: none; transition: opacity .3s; width: 120px; }
  .slabel .nm { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--h-muted); transition: color .3s; }
  .slabel .ct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--h-faint); transition: color .3s; }
  .slabel .ms { font: 11px var(--mono); color: var(--h-faint); }
  .slabel.on .nm { color: var(--h-accent); } .slabel.on .ct, .slabel.done .ct { color: var(--h-ink); } .slabel.done .nm { color: var(--h-ink); }
  .slabel .who { font-size: 10px; color: var(--h-faint); margin-top: 1px; }
  .slabel.human .nm { color: var(--h-warn); }
  .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(44%, 380px); text-align: center; pointer-events: none; }
  .core .phase { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--h-accent); font-weight: 700; min-height: 16px; }
  .core .verb { font-size: clamp(20px, 2.6vw, 30px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 6px 0 10px; min-height: 2.3em; }
  .core .flow { font: 600 13px var(--mono); color: var(--h-muted); }
  .core .flow b { color: var(--h-ink); }
  .core .ticker { margin-top: 14px; font-size: 13px; color: var(--h-muted); min-height: 3.2em; transition: opacity .35s; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .core .ticker b { color: var(--h-ink); font-weight: 600; }
  .core .clock { margin-top: 12px; font: 12px var(--mono); color: var(--h-faint); }
  .hud { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; align-items: center; z-index: 2; }
  .hud .tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--h-line); color: var(--h-muted); }
  .hud .tag.live { color: #fff; background: #c0392b; border-color: #c0392b; }
  .hud .tag.live::before { content: "● "; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .hud button { background: transparent; color: var(--h-muted); border: 1px solid var(--h-line); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  .hud button:hover { color: var(--h-ink); border-color: var(--h-muted); }
  .stream { position: relative; border-left: 1px solid var(--h-line); background: rgba(0, 0, 0, .25); display: flex; flex-direction: column; min-width: 0; }
  .stream h4 { margin: 0; padding: 14px 16px 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--h-muted); }
  .events { flex: 1; overflow: hidden; padding: 0 16px 16px; font: 11.5px/1.55 var(--mono); display: flex; flex-direction: column; justify-content: flex-end;
            mask-image: linear-gradient(to bottom, transparent 0, #000 22%); -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%); }
  .events div { color: var(--h-muted); animation: evin .35s ease-out; overflow-wrap: anywhere; }
  .events div span { color: var(--h-faint); }
  .events div b { color: var(--h-ink); font-weight: 600; }
  .events div.acc b { color: var(--h-accent); } .events div.ok b { color: var(--h-ok); } .events div.drop b { color: var(--h-warn); }
  @keyframes evin { from { opacity: 0; transform: translateY(6px); } }
  .below { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; }
  @media (max-width: 900px) {
    .hero { grid-template-columns: minmax(0, 1fr); }
    .stream { border-left: 0; border-top: 1px solid var(--h-line); max-height: 220px; }
    .stagearea { min-height: 560px; }
    .core { width: 58%; }
    .slabel { width: 90px; } .slabel .ct { font-size: 17px; } .slabel .who { display: none; }
  }
  .funnel .drop { font-size: 11.5px; color: var(--faint); text-align: right; min-width: 6ch; }

  /* ---------- lineage ---------- */
  .lineage { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 56px; }
  .lineage svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .edges path { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: stroke .15s, opacity .15s; }
  .edges path.hot { stroke: var(--accent); stroke-width: 2; }
  .edges.dimmed path:not(.hot) { opacity: .25; }
  .col { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .col h3 { margin: 0 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .node { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; position: relative; z-index: 1;
          transition: opacity .15s, border-color .15s, box-shadow .15s; min-width: 0; text-align: left; width: 100%; }
  .node:hover, .node.hot { border-color: var(--accent); }
  .node.sel { box-shadow: 0 0 0 2px var(--accent); }
  .lineage.dimmed .node:not(.hot) { opacity: .38; }
  .node .h { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 3px; min-width: 0; }
  .node .h b { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .x { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .node .m { font-size: 11.5px; color: var(--faint); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .meters { display: grid; grid-template-columns: max-content 1fr 3ch; gap: 2px 6px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .meter { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; }

  /* ---------- shared bits ---------- */
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; text-transform: uppercase; letter-spacing: .03em; font-size: 10.5px; color: var(--ink); white-space: nowrap; }
  .score { font-weight: 700; font-size: 12px; color: var(--ink); background: var(--sunk); border-radius: 5px; padding: 1px 6px; font-family: var(--mono); }
  .chip { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .chip.approved { color: var(--ok); } .chip.killed { color: var(--bad); } .chip.vetoed { color: var(--warn); } .chip.pending { color: var(--faint); }

  /* ---------- review ---------- */
  .rv-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ghost { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; }
  .hint { color: var(--muted); font-size: 12px; }
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 880px; width: 100%; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; border-left: 4px solid var(--line); }
  .card.focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .card.approved { border-left-color: var(--ok); }
  .card.killed { border-left-color: var(--bad); opacity: .65; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .ctx { border-left: 3px solid var(--line); background: var(--sunk); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 13px; }
  .ctx .who { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 2px; }
  .ctx .who a { overflow-wrap: anywhere; }
  textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 15px; }
  .count { font-size: 11px; color: var(--muted); text-align: right; margin-top: -6px; }
  .count.over { color: var(--bad); font-weight: 600; }
  details { font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .why { display: grid; gap: 6px; padding-top: 6px; }
  .panel { display: grid; grid-template-columns: max-content 1fr 3ch; gap: 3px 8px; align-items: center; font-size: 12px; }
  .bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions input { flex: 1 1 200px; min-width: 0; }
  .btn { border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 600; }
  .approve { background: var(--ok); color: #fff; }
  .kill { background: var(--bad); color: #fff; }
  .reset { background: transparent; border: 1px solid var(--line); }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }

  /* ---------- trace waterfall ---------- */
  .wf { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 70px; font-size: 12.5px; }
  .wf > div { padding: 5px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
  .wf .hd { font-size: 11px; color: var(--faint); border-bottom-color: var(--line); position: relative; }
  .wf .row { display: contents; cursor: pointer; }
  .wf .row:hover > div { background: var(--sunk); }
  .wf .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .wf .stg .nm { font-weight: 700; }
  .wf .sub .nm { padding-left: 18px; color: var(--muted); }
  .wf .lane { position: relative; }
  .wf .lane i { position: absolute; top: 50%; height: 10px; transform: translateY(-50%); border-radius: 3px; min-width: 3px; background: var(--accent); }
  .wf .sub .lane i { height: 6px; opacity: .65; }
  .wf .sub.err .lane i { background: var(--bad); opacity: 1; }
  .wf .ms { text-align: right; font-family: var(--mono); color: var(--muted); }
  .ticks { position: absolute; inset: 0; }
  .ticks span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
  .ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }

  /* ---------- tables ---------- */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  th.l, td.l { text-align: left; }
  th.on { color: var(--ink); }
  tbody tr:hover { background: var(--sunk); }
  tr.cur td { background: var(--accent-soft); }
  td .persona { color: var(--faint); font-size: 12px; white-space: normal; max-width: 42ch; display: block; }
  .ibar { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .ibar span { width: 56px; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; display: inline-block; }
  .ibar span i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }

  /* ---------- charts ---------- */
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .axis { stroke: var(--line); }
  .chart .gl { stroke: var(--line); stroke-dasharray: 2 3; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .mk { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .chart .mk:hover, .chart .hit:hover + .mk { fill: var(--ink); }
  .chart .hit { fill: transparent; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px; }
  .md { font-size: 14px; }
  .md h1, .md h2, .md h3 { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 15px; margin: 12px 0 4px; }
  .md p, .md ul { margin: 6px 0; }
  .md blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--line); color: var(--muted); }

  /* ---------- drawer & tooltip ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 8; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--card); border-left: 1px solid var(--line);
                 box-shadow: var(--shadow); transform: translateX(100%); transition: transform .22s ease; z-index: 9; display: flex; flex-direction: column; }
  aside.drawer.show { transform: none; }
  .dr-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dr-h b { font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dr-h button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; width: 28px; height: 28px; }
  .dr-b { padding: 14px 16px 40px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  pre { margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.5 var(--mono);
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; }
  .dr-sec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .links { display: grid; gap: 6px; }
  .links button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .links button:hover { border-color: var(--accent); }
  .tip { position: fixed; z-index: 12; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 7px;
         max-width: 300px; opacity: 0; transition: opacity .1s; }
  .tip.show { opacity: 1; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); z-index: 12;
           padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stage, .stage:first-child, .stage:last-child { border-radius: 0; margin: 0 -1px -1px 0; }
    .loopback { display: none; }
    .lineage { grid-template-columns: minmax(0, 1fr); gap: 18px; }

  }
  @media (max-width: 560px) {
    .rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wf { grid-template-columns: 120px 1fr 56px; }
    .brand small { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar1">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 2.5v2.5h2.5"/></svg></span>
      Harness <small id="title"></small>
    </div>
    <select id="run" aria-label="Run"></select>
    <span class="badge" id="mode"></span>
    <button class="newrun" id="newrun"></button>
    <div class="spacer"></div>
    <span class="runctl"><select id="runprov" aria-label="Provider for a new run"></select><button id="runbtn" class="ghost" title="Run observe → orient → decide → qualify now">▶ Run loop</button></span>
    <a class="ghost" href="/" style="text-decoration:none;color:inherit;font-size:13px">Review page ↗</a>
    <span class="live" id="live" title="Polling the harness every 4 seconds"><i></i><span>Live</span></span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-h"><b id="dr-title"></b><button id="dr-close" aria-label="Close">✕</button></div>
  <div class="dr-b" id="dr-body"></div>
</aside>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= state & helpers ======================= */
const VIEWS = [
  ["live", "Live"], ["loop", "Loop"], ["review", "Review"], ["trace", "Trace"], ["market", "Market"], ["minds", "Minds"], ["eval", "Eval"], ["learning", "Learning"], ["runs", "Runs"],
];
const FILTERS = {
  pending: a => a.review.status === "pending" && !a.vetoed,
  approved: a => a.review.status === "approved",
  killed: a => a.review.status === "killed",
  vetoed: a => a.vetoed && a.review.status === "pending",
  all: () => true,
};
const LABELS = { pending: "To review", approved: "Approved", killed: "Killed", vetoed: "Critic vetoed", all: "All" };
const state = {
  ctx: null, runs: [], overview: null, runId: null, actions: [], trace: null,
  view: "loop", filter: "pending", focus: 0, sel: null, sort: { minds: ["drafts", -1] }, latest: 0,
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (path, opts) => fetch(path, opts).then(r => r.json());
const human = s => String(s ?? "").replaceAll("_", " ");
const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
const fmtN = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(Math.round(n * 10) / 10);
const fmtMs = ms => ms == null ? "–" : ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)} s`;
const fmtDur = s => {
  if (s == null) return "–";
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
  return `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m`;
};
const ago = iso => {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(iso).toLocaleDateString();
};
const metricsLine = m => Object.entries(m || {}).filter(([, v]) => typeof v === "number").map(([k, v]) => `${fmtN(v)} ${esc(k)}`).join(" · ");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function tip(e, html) {
  const t = $("#tip");
  if (!html) return t.classList.remove("show");
  t.innerHTML = html; t.classList.add("show");
  const r = t.getBoundingClientRect();
  t.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + "px";
  t.style.top = Math.max(8, e.clientY - r.height - 12) + "px";
}

/* ---------- graph built from the trace + actions ---------- */
function graph() {
  const t = state.trace;
  const signals = t ? t.signals : [];
  const narratives = t ? t.narratives : [];
  const byUrl = Object.fromEntries(signals.filter(s => s.url).map(s => [s.url, s]));
  const nById = Object.fromEntries(narratives.map(n => [n.id, n]));
  const edges = [];
  narratives.forEach(n => (n.signal_urls || []).forEach(u => byUrl[u] && edges.push([`s:${byUrl[u].id}`, `n:${n.id}`])));
  state.actions.forEach(a => nById[a.narrative_id] && edges.push([`n:${a.narrative_id}`, `a:${a.id}`]));
  return { signals, narratives, byUrl, nById, edges };
}
function related(key, edges) {
  const set = new Set([key]);
  // walk upstream and downstream separately so siblings don't light up
  const walk = (k, dir) => edges.forEach(([f, t]) => {
    const [from, to] = dir > 0 ? [f, t] : [t, f];
    if (from === k && !set.has(to)) { set.add(to); walk(to, dir); }
  });
  walk(key, 1); walk(key, -1);
  return set;
}

/* ======================= routing ======================= */
function parseHash() {
  const [view, run] = location.hash.replace(/^#\/?/, "").split("/");
  return { view: VIEWS.some(v => v[0] === view) ? view : "live", run: +run || null };
}
function go(view, run = state.runId) { location.hash = `#/${view}${run ? "/" + run : ""}`; }
addEventListener("hashchange", async () => {
  const h = parseHash();
  state.view = h.view;
  if (h.run && h.run !== state.runId) await loadRun(h.run);
  else render();
});

/* ======================= data ======================= */
async function loadRun(id) {
  state.runId = id;
  const [actions, trace] = await Promise.all([api(`/api/runs/${id}`), api(`/api/console/trace/${id}`)]);
  state.actions = actions; state.trace = trace; state.focus = 0; state.sel = null;
  $("#run").value = id;
  render();
}
async function refreshMeta() {
  const [runs, overview] = await Promise.all([api("/api/runs"), api("/api/console/overview")]);
  state.runs = runs; state.overview = overview;
  $("#run").innerHTML = runs.length
    ? runs.map(r => `<option value="${r.id}">Run ${r.id} · ${new Date(r.started_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · ${r.provider}</option>`).join("")
    : `<option>No runs yet</option>`;
  if (state.runId) $("#run").value = state.runId;
}
async function boot() {
  state.ctx = await api("/api/console/context");
  $("#title").textContent = state.ctx.title;
  await refreshMeta();
  state.latest = state.runs[0]?.id || 0;
  const h = parseHash();
  state.view = h.view;
  const id = h.run || state.latest;
  if (id) await loadRun(id); else render();
  setInterval(poll, 4000);
}
async function poll() {
  try {
    const runs = await api("/api/runs");
    $("#live").classList.remove("off"); $("#live span").textContent = "Live";
    const top = runs[0]?.id || 0;
    if (top > state.latest) {
      state.latest = top;
      const b = $("#newrun"); b.textContent = `New run #${top} →`; b.dataset.id = top; b.classList.add("show");
      await refreshMeta();
      if (!state.runId) await loadRun(top);
    }
  } catch {
    $("#live").classList.add("off"); $("#live span").textContent = "Offline";
  }
}

/* ======================= render ======================= */
function curRun() { return state.overview?.runs.find(r => r.id === state.runId); }
function renderChrome() {
  const p = state.trace?.provider || state.runs.find(r => r.id === state.runId)?.provider || state.ctx?.provider;
  const m = $("#mode");
  m.textContent = p === "mock" ? "mock run · placeholder drafts" : `${p}${state.trace?.model ? " · " + state.trace.model : ""}`;
  m.className = "badge" + (p === "mock" ? " mock" : "");
  m.title = p === "mock" ? "This run used the offline mock provider; drafts and scores are canned, not model output." : "";
  const pending = state.actions.filter(FILTERS.pending).length;
  $("#nav").innerHTML = VIEWS.map(([k, label]) => {
    const n = k === "review" && state.runId ? `<span class="n ${pending ? "hot" : ""}">${pending}</span>` : "";
    return `<a href="#/${k}${state.runId ? "/" + state.runId : ""}" class="${k === state.view ? "on" : ""}">${label}${n}</a>`;
  }).join("");
}
function render() {
  if (state.view !== "live") { cancelAnimationFrame(live.raf); clearInterval(live.tick); clearTimeout(live.timer); }
  renderChrome();
  const v = $("#view");
  if (!state.runs.length && !["market", "minds", "eval", "learning"].includes(state.view)) {
    v.innerHTML = `<div class="section empty">No runs yet. Start one with <code>uv run python -m harness run --provider mock</code>; this page picks it up automatically.</div>`;
    return;
  }
  ({ live: renderLive, loop: renderLoop, review: renderReview, trace: renderTrace, market: renderMarket, minds: renderMinds, eval: renderEval, learning: renderLearning, runs: renderRuns })[state.view]();
}

/* ---------- revision rounds (critic-driven retries) ---------- */
function decideRounds() { return (state.trace?.stages || []).filter(s => s.name === "decide").length; }
function roundOf(id) {
  const rounds = (state.trace?.stages || []).filter(s => s.name === "decide");
  const i = rounds.findIndex(s => (s.ids || []).includes(id));
  return i < 0 ? 1 : i + 1;
}

/* ======================= Live: the loop, animated ======================= */
// Replays the selected run from its trace (real counts, real text, timing scaled so slow stages get more
// screen time). While a run started from the console is in flight, it follows out/trace-live.json instead.
const VERBS = {
  evolve: ["Evolve", "Rewriting lessons and breeding prompt variants"], observe: ["Observe", "Reading the info sphere"],
  orient: ["Orient", "Clustering signals into narratives"], decide: ["Decide", "Media minds drafting"],
  qualify: ["Qualify", "Audience panel and critic grading"], tournament: ["Tournament", "Drafts fight it out, pairwise"],
  sharpen_hooks: ["Hooks", "Sharpening opening lines"], review: ["Review", "Waiting on a human"], learn: ["Learn", "Outcomes feed the next loop"],
};
const live = { gen: 0, raf: 0, dots: [], steps: [], t0: 0, idx: -1, mode: "replay", nodes: [], geo: null, timer: 0, tick: 0, liveSeen: 0, liveRun: false };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Timers belong to one animation; starting another (replay or live) orphans them.
function later(fn, ms) { const gen = live.gen; return setTimeout(() => { if (gen === live.gen) fn(); }, ms); }
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function liveSteps() {
  const t = state.trace, a = state.actions, run = curRun() || {};
  const merged = t ? Object.values(t.stages.reduce((acc, s) => {
    acc[s.name] = acc[s.name] ? { ...s, ms: acc[s.name].ms + s.ms, n_out: s.n_out ?? acc[s.name].n_out } : { ...s };
    return acc;
  }, {})) : [{ name: "decide", n_out: a.length, ms: 0 }, { name: "qualify", n_out: a.filter(x => !x.vetoed).length, ms: 0 }];
  const steps = merged.map(s => ({ key: s.name, n: s.n_out ?? 0, ms: s.ms || 0 }));
  const reviewed = a.filter(x => x.review.status !== "pending").length;
  const approved = a.filter(x => x.review.status === "approved").length;
  steps.push({ key: "review", n: reviewed ? approved : (t?.ranked_ids.length || a.filter(x => !x.vetoed).length), ms: 0, human: true, reviewed, approved });
  steps.push({ key: "learn", n: run.outcomes || 0, ms: 0, vis: steps[steps.length - 1].n });  // reviewed drafts ride on to Learn
  steps.forEach(st => { st.dur = reduceMotion ? 0 : Math.max(1500, Math.min(3400, 1100 + 900 * Math.log10(1 + st.ms / 40))); });
  return steps;
}

function renderLive() {
  cancelAnimationFrame(live.raf); clearTimeout(live.timer);
  live.steps = liveSteps();
  const t = state.trace, run = curRun() || {};
  $("#view").innerHTML = `
    <section class="hero" id="hero">
      <div class="stagearea" id="stagearea">
        <canvas id="loopcv"></canvas>
        <div class="hud"><span class="tag" id="modetag">Replay · run ${state.runId ?? "–"}</span><button id="replay">↻ Replay</button></div>
        ${live.steps.map((st, i) => `<div class="slabel ${st.human ? "human" : ""}" id="sl${i}"><div class="nm">${esc((VERBS[st.key] || [human(st.key)])[0])}</div>
          <div class="ct" id="ct${i}">0</div><div class="ms" id="ms${i}"></div><div class="who">${st.human ? "human" : st.key === "learn" ? "ai + human" : "ai"}</div></div>`).join("")}
        <div class="core">
          <div class="phase" id="phase"></div>
          <div class="verb" id="verb">${t ? "Starting the loop" : "No trace for this run"}</div>
          <div class="flow" id="flow"></div>
          <div class="ticker" id="ticker"></div>
          <div class="clock" id="clock"></div>
        </div>
      </div>
      <div class="stream"><h4>Event stream</h4><div class="events" id="events"></div></div>
    </section>
    <div class="below">
      <div class="kpi"><div class="k">Loop time</div><div class="v">${t ? fmtMs(t.total_ms) : "–"}</div><div class="d">observe → ranked recommendations</div></div>
      <div class="kpi"><div class="k">Signals → recommendations</div><div class="v">${t ? `${t.signals.length} → ${t.ranked_ids.length}` : "–"}</div><div class="d">what the loop read vs. what it proposes</div></div>
      <div class="kpi"><div class="k">LLM calls</div><div class="v">${t ? t.llm_calls.length : "–"}</div><div class="d">${t ? `${t.llm_calls.filter(c => !c.ok).length} errors` : "no trace"}</div></div>
      <div class="kpi"><div class="k">Time to human decision</div><div class="v">${fmtDur(run.decision_s)}</div><div class="d">median, run start → verdict</div></div>
    </div>`;
  $("#replay").onclick = () => startReplay();
  layoutLive();
  if (live.liveRun) startLiveFollow(); else startReplay();
}

function layoutLive() {
  const area = $("#stagearea"), cv = $("#loopcv");
  if (!area || !cv) return;
  const w = area.clientWidth, h = area.clientHeight, dpr = devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = Math.max(120, Math.min(w, h) / 2 - (w < 600 ? 70 : 96)), cx = w / 2, cy = h / 2 + 6;
  const n = live.steps.length;
  live.geo = { ctx, w, h, R, cx, cy };
  live.nodes = live.steps.map((_, i) => {
    const ang = -Math.PI / 2 + (i / n) * Math.PI * 2;
    const lx = cx + Math.cos(ang) * (R + (w < 600 ? 44 : 62)), ly = cy + Math.sin(ang) * (R + (w < 600 ? 40 : 52));
    const el = $("#sl" + i); if (el) { el.style.left = lx + "px"; el.style.top = ly + "px"; }
    return { ang, x: cx + Math.cos(ang) * R, y: cy + Math.sin(ang) * R };
  });
}
addEventListener("resize", () => { if (state.view === "live") { layoutLive(); } });

/* ----- particles ----- */
const capDots = n => n <= 0 ? 0 : Math.max(1, Math.min(70, Math.round(n <= 70 ? n : 40 + Math.log2(n) * 3)));
function dotSize(n) { return Math.max(2.8, Math.min(6.5, 14 / Math.sqrt(Math.max(n, 1)))); }
function spawnTravel(from, to, count, size, now, span) {
  const kept = live.dots.filter(d => d.at === from && d.state === "pile");
  const movers = kept.slice(0, count);
  while (movers.length < count) {   // nothing piled (first stage or a bloom): enter from the node itself
    movers.push({ at: from, state: "pile", x: live.nodes[from]?.x ?? 0, y: live.nodes[from]?.y ?? 0, r: size, a: 0, born: now });
    live.dots.push(movers[movers.length - 1]);
  }
  kept.slice(count).forEach(d => Object.assign(d, { state: "drop", t0: now, ox: d.x, oy: d.y }));
  movers.forEach((d, i) => Object.assign(d, {
    state: "move", from, to, t0: now + (i / Math.max(count, 1)) * span * .45, dur: span * .55,
    lane: (Math.random() - .5) * 22, r0: d.r, r: size, a: 1,
  }));
}
function settle(i, target, size, now) {
  const here = live.dots.filter(d => d.at === i && (d.state === "pile" || d.state === "move"));
  if (here.length > target) here.slice(target).forEach(d => Object.assign(d, { state: "drop", t0: now + 300, ox: null }));
  for (let k = here.length; k < target; k++) {  // bloom: one input became many outputs
    const n = live.nodes[i];
    live.dots.push({ at: i, state: "pile", x: n.x, y: n.y, r: size, a: 0, born: now + Math.random() * 500, orbit: Math.random() * Math.PI * 2, rad: 8 + Math.random() * 26 });
  }
}
function drawLive(now) {
  const g = live.geo; if (!g) return;
  const { ctx, w, h, R, cx, cy } = g;
  ctx.clearRect(0, 0, w, h);
  // ring
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#2a2a27"; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  // progress arc
  if (live.idx >= 0) {
    const n = live.steps.length, st = live.steps[live.idx];
    const frac = Math.min(1, (now - live.stepStart) / Math.max(st?.dur || 1, 1));
    const end = live.finished ? Math.PI * 1.5 : -Math.PI / 2 + ((live.idx + (live.mode === "live" ? .5 : frac)) / n) * Math.PI * 2;
    const grad = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    grad.addColorStop(0, "rgba(240,122,80,.25)"); grad.addColorStop(1, "rgba(240,122,80,.9)");
    ctx.strokeStyle = grad; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, end); ctx.stroke();
  }
  // dots
  for (const d of live.dots) {
    if (d.state === "move") {
      const p = Math.max(0, Math.min(1, (now - d.t0) / d.dur));
      if (p <= 0) { const n0 = live.nodes[d.from]; d.x ??= n0.x; d.y ??= n0.y; }
      else {
        const a0 = live.nodes[d.from].ang, a1raw = live.nodes[d.to].ang, a1 = a1raw <= a0 ? a1raw + Math.PI * 2 : a1raw;

function drawEdges() {

  if (state.view !== "review") return;

  };
  if (e.key === "j") move(1);
  else if (e.key === "k") move(-1);

    rows.push({ cls: "stg", name: s.name, start: s.start_ms, ms: s.ms, dot: (t.llm_calls.some(c => c.stage === s.name && !c.ok) || (s.name === "observe" && t.sources.some(x => !x.n))) ? "err" : "done" });
    if (s.name === "observe") t.sources.forEach(x => rows.push({ cls: "sub" + (x.n ? "" : " err"), name: x.error ? `${x.name} · ${x.error}` : `${x.name} · ${x.n} signals`, start: x.start_ms, ms: x.ms }));
    t.llm_calls.map((c, i) => ({ c, i })).filter(({ c }) => c.stage === s.name).sort((a, b) => a.c.start_ms - b.c.start_ms)
      .forEach(({ c, i }) => rows.push({ cls: "sub" + (c.ok ? "" : " err"), name: c.label, start: c.start_ms, ms: c.ms, call: i }));
  });
  const ticks = [0, .25, .5, .75, 1].map(f => `<span style="left:${f * 100}%">${fmtMs(Math.round(total * f))}</span>`).join("");
  const calls = t.llm_calls, inChars = calls.reduce((s, c) => s + c.system_chars + c.prompt_chars, 0), outChars = calls.reduce((s, c) => s + c.response_chars, 0);
  const slow = [...calls].sort((a, b) => b.ms - a.ms)[0];
  $("#view").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k">Wall time</div><div class="v">${fmtMs(t.total_ms)}</div><div class="d">${t.stages.length} stages</div></div>
      <div class="kpi"><div class="k">LLM calls</div><div class="v">${calls.length}</div><div class="d">${calls.filter(c => !c.ok).length} errors</div></div>
      <div class="kpi"><div class="k">Context in / out</div><div class="v">~${fmtN(inChars / 4)}<small>/ ${fmtN(outChars / 4)} tok</small></div><div class="d">estimated at 4 chars per token</div></div>
      <div class="kpi"><div class="k">Slowest call</div><div class="v">${slow ? fmtMs(slow.ms) : "–"}</div><div class="d">${slow ? esc(slow.label) + " · " + esc(slow.stage) : ""}</div></div>
    </div>
    <section class="section">
      <h2>Waterfall <span class="sub">click a call to see its prompt and response</span></h2>
      <div class="wf">
        <div class="hd">Span</div><div class="hd"><div class="ticks">${ticks}</div>&nbsp;</div><div class="hd" style="text-align:right">Time</div>
        ${rows.map(r => `<div class="row ${r.cls}" ${r.call != null ? `data-call="${r.call}"` : ""}>
          <div class="nm">${r.dot ? `<span class="dot ${r.dot}"></span>` : ""}${esc(r.cls.startsWith("stg") ? stageTitle(r.name) : human(r.name))}</div>
          <div class="lane"><i style="left:${(r.start / total) * 100}%;width:${(r.ms / total) * 100}%"></i></div>
          <div class="ms">${fmtMs(r.ms)}</div></div>`).join("")}
      </div>
    </section>
    ${t.bandit ? banditHtml(t.bandit) : ""}`;
  $(".wf").onclick = e => { const r = e.target.closest("[data-call]"); if (r) inspectCall(+r.dataset.call); };
}

/* ---------- Minds ---------- */
function renderMinds() {
  const minds = state.overview?.minds || [];
  const reviewed = m => (m.approved || 0) + (m.killed || 0);
  const cols = [
    ["name", "Mind", m => m.name, "l"],
    ["drafts", "Drafts", m => m.drafts || 0],
    ["veto", "Veto rate", m => pct(m.vetoed || 0, m.drafts)],
    ["approval", "Approval", m => pct(m.approved || 0, reviewed(m))],
    ["edit", "Edited", m => pct(m.edited || 0, m.approved || 0)],
    ["avg_predicted", "Predicted", m => m.avg_predicted == null ? null : Math.round(m.avg_predicted * 100)],
    ["avg_actual", "Actual eng.", m => m.avg_actual],
  ];
  const [sk, dir] = state.sort.minds;
  const col = cols.find(c => c[0] === sk) || cols[1];
  const sorted = [...minds].sort((a, b) => {
    const x = col[2](a), y = col[2](b);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const bar = v => v == null ? `<span class="muted">–</span>` : `<span class="ibar">${v}%<span><i style="width:${v}%"></i></span></span>`;
  $("#view").innerHTML = `
    <section class="section">
      <h2>Minds &amp; variants <span class="sub">all runs · how each mind (or prompt variant) fares at the critic, the human checkpoint, and on X</span></h2>
      <div class="tbl-wrap"><table>
        <thead><tr>${cols.map(([k, label, , cls]) => `<th data-k="${k}" class="${cls || ""} ${k === sk ? "on" : ""}">${label}${k === sk ? (dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
        <tbody>${sorted.map(m => `<tr>
          <td class="l"><b>${m.name === m.mind ? esc(human(m.name)) : `<code>${esc(m.name)}</code>`}</b><span class="persona">${esc(state.ctx.minds[m.mind] || "no seed prompt file")}</span></td>
          <td>${m.drafts || 0}</td><td>${bar(pct(m.vetoed || 0, m.drafts))}</td>
          <td>${bar(pct(m.approved || 0, reviewed(m)))}<div class="muted" style="font-size:11px">${m.approved || 0}/${reviewed(m)} reviewed</div></td>
          <td>${bar(pct(m.edited || 0, m.approved || 0))}</td>
          <td>${m.avg_predicted == null ? "–" : Math.round(m.avg_predicted * 100)}</td>
          <td>${m.avg_actual == null ? `<span class="muted">no outcomes</span>` : fmtN(m.avg_actual)}</td></tr>`).join("")}</tbody>
      </table></div>
    </section>
    <div class="note-strip"><b>Reading this:</b> a high edit rate means a mind's voice is close but off; a high veto rate means it keeps drifting off-mission; predicted far above actual means the audience panel overrates it.</div>`;
  $("thead").onclick = e => {
    const k = e.target.closest("th")?.dataset.k; if (!k) return;
    state.sort.minds = [k, sk === k ? -dir : (k === "name" ? 1 : -1)]; renderMinds();
  };
}

function banditHtml(b) {
  const chosen = new Set(b.chosen);
  const arms = [...b.arms].sort((x, y) => chosen.has(y.id) - chosen.has(x.id) || y.mean - x.mean);
  return `<section class="section">
    <h2>Bandit draw <span class="sub">Thompson sampling over mind variants: which prompts got to draft this run</span></h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="l">Variant</th><th>Drafted</th><th>Scored drafts</th><th>Mean reward</th></tr></thead>
      <tbody>${arms.map(x => `<tr><td class="l"><code>${esc(x.id)}</code></td><td>${chosen.has(x.id) ? `<span class="chip approved">✓ drew</span>` : `<span class="chip pending">sat out</span>`}</td>
        <td>${x.n}</td><td><span class="ibar">${Math.round(x.mean * 100)}<span><i style="width:${Math.round(x.mean * 100)}%"></i></span></span></td></tr>`).join("")}</tbody>
    </table></div>
    <div class="hint" style="margin-top:8px">Few scored drafts means the bandit is still exploring; a variant with a high mean and many trials is the current champion.</div>
  </section>`;
}

/* ---------- Eval ---------- */
function corrBars(obj) {
  // Diverging bars around zero: Spearman runs −1..1.
  return `<div class="corr">${Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) => {
    const w = Math.abs(v) * 50, left = v >= 0 ? 50 : 50 - w;
    return `<span>${esc(human(k))}</span><span class="ctrack"><b></b><i style="left:${left}%;width:${w}%"></i></span><span class="val">${v >= 0 ? "+" : ""}${v.toFixed(2)}</span>`;
  }).join("")}</div>`;
}
async function renderEval() {
  if (!state.evals) state.evals = await api("/api/console/evals");
  const reps = state.evals.filter(r => !r.error);
  if (!reps.length) {
    $("#view").innerHTML = `<div class="section empty">No eval reports yet.<br><br><code>uv run python -m harness backtest</code> grades the audience panel and the pairwise judge against real engagement in the dev-tool dataset and writes <code>eval/backtest-*.json</code>; reports show up here.</div>`;
    return;
  }
  const r = reps[0], panel = r.panel || {}, judge = r.judge || {};
  const rho = panel.spearman_calibrated ?? panel.spearman_unweighted;
  const tiles = [
    ["Panel ↔ real engagement", rho != null ? `${rho >= 0 ? "+" : ""}${rho.toFixed(2)}` : "–",
      `Spearman ρ over ${panel.n_posts ?? "?"} posts${panel.spearman_calibrated != null ? ` · ${panel.spearman_unweighted.toFixed(2)} before calibration` : ""}`],
    ["Judge picks the winner", judge.accuracy != null ? `${Math.round(judge.accuracy * 100)}<small>%</small>` : "–", `${judge.n_pairs ?? "?"} viral-vs-flop pairs · 50% is chance`],
    ["Calibrated", r.calibrated ? "yes" : "no", r.calibrated ? "fitted panel weights applied" : "weights not applied"],
    ["Graded by", esc(r.provider || "–"), new Date(r.at).toLocaleString()],

  $("#view").innerHTML = `
    <div class="kpis">${tiles.map(([k, v, d]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("")}</div>
    <div class="note-strip"><b>Why this matters:</b> the audience panel ranks every draft before a human sees it. ρ says how well its order matches what really spread; if it drops toward 0, the ranking is noise and the panel needs recalibrating.</div>
    <div class="grid2">
      <section class="section">
        <h2>Panelists <span class="sub">each simulated audience member's rank correlation with real engagement</span></h2>
        ${panel.per_panelist_spearman ? corrBars(panel.per_panelist_spearman) : `<div class="empty">No per-panelist scores in this report.</div>`}
      </section>

          const max = Math.max(...Object.values(panel.suggested_weights));
          return Object.entries(panel.suggested_weights).sort((a, b) => b[1] - a[1]).map(([k, w]) =>
            `<span>${esc(human(k))}</span><span class="track"><i style="width:${(w / max) * 100}%"></i></span><span class="val">${w.toFixed(2)}</span>`).join("");
        })()}</div>` : `<div class="empty">No weights in this report.</div>`}
      </section>
    </div>
    <section class="section">

      <div class="tbl-wrap"><table>
        <thead><tr><th class="l">Report</th><th class="l">When</th><th class="l">Provider</th><th>Posts</th><th>Panel ρ</th><th>Calibrated ρ</th><th>Judge pairs</th><th>Judge acc.</th></tr></thead>

          <td>${x.panel?.n_posts ?? "–"}</td><td>${x.panel?.spearman_unweighted?.toFixed(2) ?? "–"}</td><td>${x.panel?.spearman_calibrated?.toFixed(2) ?? "–"}</td>

}

async function refreshRunCtl(watch = false) {

  if (!sel.options.length) {
    const provs = [...new Set(["mock", st.default_provider])];
    sel.innerHTML = provs.map(p => `<option value="${p}">${p}</option>`).join("");
    sel.value = st.default_provider;
  }
  const btn = $("#runbtn");
  btn.classList.toggle("busy", st.running);
  btn.textContent = st.running ? `● Running (${st.provider})…` : "▶ Run loop";

  else if (watch) {
    if (st.exit_code === 0) { toast("Run finished"); if (state.view !== "live") { await poll(); $("#newrun").classList.remove("show"); go("loop", state.latest); } }
    else openDrawer("Run failed", `<div class="note-strip">Exit code ${st.exit_code}. Output from <code>out/console-run.log</code>:</div><pre>${esc(st.log)}</pre>`);

}
$("#runbtn").addEventListener("click", async () => {

/* ---------- Learning ---------- */
function mdHtml(md) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  let html = "", list = false;
  for (const raw of md.split("\n")) {
    const ln = raw.trimEnd();
    const li = ln.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    const h = ln.match(/^(#{1,3})\s+(.*)/);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (ln.startsWith(">")) html += `<blockquote>${inline(ln.replace(/^>\s?/, ""))}</blockquote>`;
    else if (ln.trim()) html += `<p>${inline(ln)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}
function scatter(points) {
  const W = 520, H = 260, P = { l: 44, r: 12, t: 10, b: 34 };
  const maxY = Math.max(1, ...points.map(p => p.actual));
  const x = v => P.l + v * (W - P.l - P.r), y = v => H - P.b - (v / maxY) * (H - P.t - P.b);
  const yt = [0, .5, 1].map(f => maxY * f);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted score versus actual engagement">
    ${yt.map(v => `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`).join("")}
    <line class="axis" x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}"/>
    ${[0, .25, .5, .75, 1].map(v => `<text x="${x(v)}" y="${H - P.b + 16}" text-anchor="middle">${v * 100}</text>`).join("")}
    <text x="${(P.l + W - P.r) / 2}" y="${H - 2}" text-anchor="middle">predicted score</text>
    ${points.map((p, i) => `<circle class="hit" r="12" cx="${x(p.predicted)}" cy="${y(p.actual)}" data-i="${i}"/><circle class="mk" r="5" cx="${x(p.predicted)}" cy="${y(p.actual)}" pointer-events="none"/>`).join("")}
  </svg>`;
}
function renderLearning() {
  const o = state.overview, f = o.feedback, pts = o.calibration;
  const tiles = [
    ["Drafts reviewed", `${f.reviewed}<small>/ ${f.drafts}</small>`, "human verdicts on record"],
    ["Human edits", f.edited, "before → after pairs"],
    ["Review notes", f.noted, "free-text feedback"],
    ["Outcomes", f.outcomes, "drafts with real engagement"],
  ];
  $("#view").innerHTML = `
    <div class="kpis">${tiles.map(([k, v, d]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("")}</div>
    <div class="note-strip"><b>What feeds learning today:</b> <code>harness learn</code> reads recorded outcomes only. Reviews, edits and notes are stored but not yet read by it, so they don't change the lessons file.</div>
    <div class="grid2">
      <section class="section chart">
        <h2>Calibration <span class="sub">predicted score vs. actual engagement</span></h2>
        ${pts.length ? scatter(pts) : `<div class="empty">No outcomes yet. After the bot posts, save metrics as <code>[{"action_id": "…", "metrics": {"likes": 3}}]</code> and run <code>uv run python -m harness record &lt;file&gt;</code>.</div>`}
      </section>
      <section class="section">
        <h2>Lessons <span class="sub">${state.ctx.lessons_updated ? "memory/lessons.md · updated " + ago(state.ctx.lessons_updated) : "memory/lessons.md"}</span></h2>
        <div class="md">${mdHtml(state.ctx.lessons)}</div>
      </section>
    </div>
    <section class="section">
      <details><summary><b>Mission</b> <span class="muted">· mission/mission.md, read by every stage</span></summary><div class="md">${mdHtml(state.ctx.mission)}</div></details>
    </section>`;
  const svg = $(".chart svg");
  if (svg) {
    svg.addEventListener("mousemove", e => {
      const i = e.target.dataset?.i; if (i == null) return tip(e, "");
      const p = pts[+i];
      tip(e, `<b>${esc(human(p.mind))}</b> · ${esc(p.type)} · run ${p.run_id}<br>predicted ${Math.round(p.predicted * 100)} · actual ${fmtN(p.actual)}<br><span style="opacity:.75">${esc((p.text || "").slice(0, 90))}</span>`);
    });
    svg.addEventListener("mouseleave", e => tip(e, ""));
  }
}

/* ---------- Runs ---------- */
function renderRuns() {
  const runs = state.overview?.runs || [];
  const ordered = [...runs].reverse();
  const W = 520, H = 150, P = { l: 34, r: 8, t: 10, b: 24 }, bw = Math.min(28, (W - P.l - P.r) / Math.max(ordered.length, 1) - 4);
  const rate = r => pct(r.approved, r.approved + r.killed);
  const bars = ordered.map((r, i) => {
    const v = rate(r), x = P.l + i * ((W - P.l - P.r) / ordered.length) + 2, h = v == null ? 0 : (v / 100) * (H - P.t - P.b);
    return `<g><rect class="hit" x="${x - 2}" y="${P.t}" width="${bw + 4}" height="${H - P.t - P.b}" data-i="${i}"/>
      ${v == null ? `<line x1="${x}" x2="${x + bw}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--line)" stroke-width="2"/>` : `<path class="mk" pointer-events="none" d="M${x},${H - P.b} v${-Math.max(h - 4, 0)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${Math.max(h - 4, 0)} z"/>`}
      <text x="${x + bw / 2}" y="${H - P.b + 14}" text-anchor="middle">#${r.id}</text></g>`;
  }).join("");
  $("#view").innerHTML = `
    <section class="section chart">
      <h2>Approval rate by run <span class="sub">share of human-reviewed drafts that were approved</span></h2>
      <svg viewBox="0 0 ${W} ${H}">${[0, 50, 100].map(v => { const y = H - P.b - (v / 100) * (H - P.t - P.b); return `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${v}%</text>`; }).join("")}${bars}</svg>
    </section>
    <section class="section">
      <h2>All runs</h2>
      <div class="tbl-wrap"><table>
        <thead><tr><th class="l">Run</th><th class="l">Started</th><th class="l">Provider</th><th>Signals</th><th>Narratives</th><th>Drafts</th><th>Vetoed</th><th>Approved</th><th>Killed</th><th>Edited</th><th>Loop time</th><th>To decision</th></tr></thead>
        <tbody>${runs.map(r => `<tr class="${r.id === state.runId ? "cur" : ""}" data-id="${r.id}" style="cursor:pointer">
          <td class="l"><b>#${r.id}</b></td><td class="l">${new Date(r.started_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</td>
          <td class="l">${r.provider === "mock" ? `<span class="badge mock">mock</span>` : esc(r.provider)}</td>
          <td>${r.signals ?? "–"}</td><td>${r.narratives ?? "–"}</td><td>${r.drafts}</td><td>${r.vetoed}</td><td>${r.approved}</td><td>${r.killed}</td><td>${r.edited}</td>
          <td>${fmtMs(r.total_ms)}</td><td>${fmtDur(r.decision_s)}</td></tr>`).join("")}</tbody>
      </table></div>
    </section>`;
  $("tbody").onclick = e => { const tr = e.target.closest("tr"); if (tr) go("loop", +tr.dataset.id); };
  const svg = $(".chart svg");
  svg.addEventListener("mousemove", e => {
    const i = e.target.dataset?.i; if (i == null) return tip(e, "");
    const r = ordered[+i], v = rate(r);
    tip(e, `<b>Run #${r.id}</b><br>${v == null ? "not reviewed yet" : `${v}% approved`} · ${r.approved}✓ ${r.killed}✗ of ${r.drafts} drafts`);
  });
  svg.addEventListener("mouseleave", e => tip(e, ""));
  svg.addEventListener("click", e => { const i = e.target.dataset?.i; if (i != null) go("loop", ordered[+i].id); });
}

/* ======================= wiring ======================= */
$("#run").addEventListener("change", e => go(state.view, +e.target.value));
$("#newrun").addEventListener("click", e => { e.target.classList.remove("show"); go(state.view, +e.target.dataset.id); });
boot();
refreshRunCtl();
</script>
</body>
